name: CMake CTest

on:
  workflow_dispatch:

jobs:
  test-project:
    name: Building and testing on ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            terminal: bash

          - os: windows-latest
            compiler: msvc
            terminal: bash

          - os: windows-latest
            compiler: mingw
            terminal: msys2 {0}

    defaults:
      run:
        shell: ${{ matrix.terminal }}

    steps:
      - uses: actions/checkout@v7